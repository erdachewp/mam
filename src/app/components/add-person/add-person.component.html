<div class="container mt-4" >
    <div class="card">
            <h1> Add A Person</h1>
<form [formGroup]="personForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input 
        type="text" 
        [(ngModel)]="firstName" 
        [ngModelOptions]="{standalone: true}"  
        class="form-control" 
        id="firstName" 
        required
        placeholder="First name"> 
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input 
        type="text" 
        [(ngModel)]="lastName" 
        [ngModelOptions]="{standalone: true}"  
        class="form-control" 
        id="lastName" 
        placeholder="Last name"> 
    </div>
    <div class="form-group">
        <label for="address">Address</label>
        <input 
          type="text" 
          class="form-control"  
          [(ngModel)]="address" 
          [ngModelOptions]="{standalone: true}" 
          id="address" 
          placeholder="Address"> 
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="phone" 
          [ngModelOptions]="{standalone: true}" 
          id="phone" 
          placeholder="Phone"> 
      </div>

      <h3>Addresses</h3>

      <button (click)="addAddress()"> addressForm </button>
      <div formArrayName="addresses">
        <div 
          *ngFor="let addressGroup of addresses.controls;
          let i = index"
          [formGroupName]="i"
          >
          <label id="street">Street</label>
          <input 
            type="text" 
            id="street" 
            formControlName="street" 
            name="street" /><br>

          <label id="city">City</label>
          <input 
            type="text" 
            id="city" 
            formControlName="city" 
            name="city" /><br>

          <label id="state">State</label>
          <input 
            type="text" 
            id="state" 
            formControlName="state" 
            name="state" /><br>

          <label id="zip">Zip</label>
          <input 
            type="text" 
            id="zip" 
            formControlName="zip" 
            name="zip" />
        </div>
      </div>

      <!-- <div *ngIf="thereIsAtLeastOneItemInAddressesArray">
        <h5>Addresses Added:</h5>
        <div *ngFor="let address of addresses">
          <p>{{ address.street }} {{ address.city }} {{ address.state }} {{ address.zip }}</p>
        </div>
      </div> -->
  
      <!-- <app-address (newAddress)="addnewAddress($event)"></app-address> -->
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
</div>
